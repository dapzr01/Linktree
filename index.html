<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <title>Dapzr Linktree</title>
</head>
<body>
    <div class="container animate__animated animate__zoomIn">
        <!-- Profile Picture -->
        <div class="profile">
            <img src="Logo Dapzr.jpeg" alt="error image" class="animate__animated animate__fadeInDownBig" />
            <p class="animate__animated animate__fadeInDownBig">Welcome To My Page</p>
        </div>

        <!-- Linktree -->
        <div class="link animate__animated animate__bounceInLeft animate__delay-1s">
             <a href="https://www.youtube.com/@DapaIsHere" target="_blank">
                <img src="Logo youtube.png" alt="Youtube">
                <span>YouTube</span>
            </a>

            <a href="https://www.instagram.com/mdf_daffa_" target="_blank">
                <img src="Logo Instagram.png" alt="Instagram">
                <span>Instagram</span>
            </a>

            <a href="https://www.tiktok.com/@dapaishere__" target="_blank">
                <img src="Logo Tiktok.png" alt="TikTok">
                <span>TikTok</span>
            </a>

            <a href="https://saweria.co/DapaIsHere" target="_blank">
                <img src="Logo Saweria.co.png" alt="Saweria">
                <span>Saweria</span>
            </a>
        </div>

        <!-- Footer -->
        <div class="footer animate__animated animate__fadeInUpBig">
            <i>Thank You for Coming</i>
        </div>
    </div>
</body>
</html>
